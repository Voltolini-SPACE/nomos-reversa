[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomos-reversa"
version = "1.0.0"
description = "NOMOS Reversa — mapeamento e engenharia reversa de ferramentas de terceiros, sem executá-las"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Se7enpay"}]
readme = "README.md"
keywords = ["nomos", "reversa", "mapeamento", "seguranca", "supply-chain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Voltolini-SPACE/nomos-reversa"
Repository = "https://github.com/Voltolini-SPACE/nomos-reversa"
Parent = "https://github.com/Voltolini-SPACE/nomos"

[project.scripts]
nomos-reversa = "nomos_reversa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S110"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
